spring:
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          # El modelo se puede sobreescribir sin tocar código:
          #   ANTHROPIC_MODEL=claude-haiku-4-5-20251001 mvn spring-boot:run
          model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
          max-tokens: 2048
          temperature: 0.2

resilience4j:
  retry:
    instances:
      llm-call:
        max-attempts: 4
        wait-duration: 500ms
        exponential-backoff-multiplier: 2.0
        # Solo reintentar errores transitorios.
        # Los errores de cliente (4xx) se lanzan como BadRequestException
        # y quedan en ignore-exceptions — no se reintentan.
        retry-exceptions:
          - com.curso.reviewer.service.TransientLlmException
        ignore-exceptions:
          - com.curso.reviewer.service.BadRequestException

logging:
  level:
    com.curso.reviewer: DEBUG
